[package]
name = "chlive-e2e"
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chlive-engine = { path = "../engine" }
chlive-server = { path = "../server" }
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "dynamic-linking"] }
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-tungstenite = "0.30"
