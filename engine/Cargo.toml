[package]
name = "chlive-engine"
edition = "2021"
version = "0.1.0"
license = "MIT"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
chdb-rust = "2.0"
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "dynamic-linking"] }
chrono-tz = "0.10"
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
