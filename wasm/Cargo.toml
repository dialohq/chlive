[package]
name = "chlive-wasm"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "chlive-core for the TS client, as WebAssembly: its own rows placed as the server will place them"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# without every timezone's data: plans with DAY or WEEK in a zone other than UTC are refused
chlive-core = { path = "../core", default-features = false }
chlive-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# must be the version of the dev shell's wasm-bindgen CLI (nix/toolchain.nix)
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6"
