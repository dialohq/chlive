[package]
name = "chlive-wasm"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "chlive-core for the TS client, as WebAssembly: a result's rows, and placing rows as the server would"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chlive-core = { path = "../core" }
chlive-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# must be the version of the dev shell's wasm-bindgen CLI (nix/toolchain.nix)
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6"
