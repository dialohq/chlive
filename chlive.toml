# chlive server configuration (matches docker-compose.yml)
listen = "0.0.0.0:8080"
debounce_ms = 100
rows_limit_cap = 1000

[main]
url = "http://localhost:8123"
# readonly=2 user with max_execution_time / max_memory_usage (infra/main-users.xml)
user = "chlive_ro"
password = "chlive_ro"
database = "default"
# native protocol port exposed by docker-compose.yml, for remote() from the embedded chDB cache
native_address = "localhost:19000"

[cache]
# embedded chDB (in-process, in-memory); each connection runs one statement at a time
pool_size = 4
# `main_ro` is a named collection the server creates in chDB at startup from [main]
remote_source = "remote(main_ro, database = '{database}', table = '{table}')"

[kafka]
brokers = "localhost:19092"
batch_rows = 1000
batch_ms = 50

[[tables]]
name = "events"
topic = "events"

[[tables]]
name = "customers"
topic = "customers"

[[tables]]
name = "orders"
topic = "orders"
