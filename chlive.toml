# chlive server configuration (matches the dnvr processes in flake.nix)
listen = "0.0.0.0:8080"
debounce_ms = 100

[main]
url = "http://127.0.0.1:18123"
# readonly=2 user with max_execution_time / max_memory_usage (created in infra/main-init.sql)
user = "chlive_ro"
password = "chlive_ro"
database = "default"
# main's native protocol port (dnvr `clickhouse` process), for remote() from the embedded chDB cache
native_address = "127.0.0.1:19000"

[cache]
# embedded chDB (in-process, in-memory); each connection runs one statement at a time
pool_size = 4
# `main_ro` is a named collection the server creates in chDB at startup from [main]
remote_source = "remote(main_ro, database = '{database}', table = '{table}')"
# chDB's own ClickHouse log on the console (only shown in a terminal); noisy, see NOTES.md
console_log = false

[kafka]
brokers = "127.0.0.1:19092"
batch_rows = 1000
batch_ms = 50

[[tables]]
name = "events"
topic = "events"

[[tables]]
name = "customers"
topic = "customers"

[[tables]]
name = "orders"
topic = "orders"
