<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chlive chat</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --ink: #1d1d1f;
        --muted: #6b6b70;
        --line: #e3e3e0;
        --accent: #3b5bdb;
        --warn: #b45309;
        --warn-bg: #fff7e6;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 16px; margin: 0; }
      header p { margin: 0; color: var(--muted); }
      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
      .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 380px; overflow: hidden; }
      .pane-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .pane-top select { font: inherit; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #bbb; }
      .dot.live { background: #16a34a; }
      .dot.loading, .dot.cached { background: #f59e0b; }
      .dot.error { background: #dc2626; }
      .messages { flex: 1; overflow-y: auto; padding: 6px 10px; }
      .msg { padding: 2px 0; }
      .msg .who { font-weight: 600; margin-right: 6px; }
      .msg .when { color: var(--muted); font-size: 11px; margin-right: 6px; }
      form.compose { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
      form.compose input { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
      form.compose button { font: inherit; padding: 6px 12px; border: 0; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; }
      .error { color: #dc2626; font-size: 12px; padding: 0 10px 6px; }
      .denied { color: #dc2626; padding: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
