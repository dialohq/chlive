<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chlive playground</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      table { border-collapse: collapse; margin: 8px 0 24px; }
      td, th { border-bottom: 1px solid #ddd; padding: 3px 10px; text-align: left; font-size: 14px; }
      textarea { width: 100%; max-width: 900px; font: 14px ui-monospace, monospace; padding: 6px; box-sizing: border-box; }
      input.params { display: block; width: 100%; max-width: 900px; font: 13px ui-monospace, monospace; padding: 4px 6px; box-sizing: border-box; margin-top: 4px; }
      button.preset { display: block; margin: 3px 0; font: 12px ui-monospace, monospace; text-align: left; }
      .status { padding: 1px 6px; border-radius: 3px; background: #eee; }
      .status.live { background: #d4f5d4; }
      .status.cached { background: #fdf0c8; }
      .status.error { background: #f8d4d4; }
      .status.idle { background: #e4e4f4; }
      .error { color: #b00; white-space: pre-wrap; }
      .ok { color: #070; }
      /* narrow: the writer above the (long) result; wide: the writer beside it, sticky */
      .panes { display: grid; gap: 8px 32px; grid-template-areas: "writer" "query"; }
      .panes .query { grid-area: query; min-width: 0; }
      .panes .side { grid-area: writer; }
      @media (min-width: 1100px) {
        .panes { grid-template-columns: minmax(0, 1fr) 460px; grid-template-areas: "query writer"; align-items: start; }
        .panes .side { position: sticky; top: 16px; }
      }
      .writer button { margin: 2px 4px 2px 0; }
      h2 { font-size: 16px; margin: 8px 0; }
      .generator input[type=number] { width: 70px; }
      .generator button.start { background: #d4f5d4; }
      .generator button.stop { background: #f8d4d4; }
      .debug { background: #f6f6f6; border: 1px solid #ddd; border-radius: 4px; padding: 6px 10px; margin: 8px 0; font-size: 13px; }
      .debug summary { cursor: pointer; font-weight: 600; }
      .debug table.kv { margin: 6px 0; }
      .debug table.kv th { font-weight: normal; color: #666; padding-right: 12px; white-space: nowrap; vertical-align: top; }
      .debug table.kv td, .debug table.kv th { border: none; padding: 1px 6px 1px 0; font-size: 13px; }
      .debug ol.log { margin: 0; padding-left: 0; list-style: none; max-height: 220px; overflow: auto; font-size: 12px; }
      .debug ol.log li { cursor: pointer; padding: 1px 4px; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .debug ol.log li:hover, .debug ol.log li.open { background: #e8eefc; }
      .debug pre.json { max-height: 300px; overflow: auto; background: #fff; border: 1px solid #ddd; padding: 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
