# chlive-server's config for the chat demo's stack (nix/chat.nix), with its permissions in
# WorkOS (Postgres instead: nix/chlive.chat.postgres.toml, `CHAT_SECURITY=postgres dnvr up`):
# addresses come as flags from the dnvr `chat-server` process; this is the rest.
[clickhouse]
password = "chlive_ro"
snapshot_password = "chlive_snap"
snapshot_database = "chlive_snapshots"

[cache]
dir = ".dnvr/chat-chlive-cache"

[log]
level = "info,chlive_server::hub=debug"

# Security: per WorkOS (scripts/chat/workos.ts sets it up), asked again every `poll`: who may
# read the messages (their role in the organization has `messages:read`), and whose (the feeds
# they hold `feed:read` on: a feed's external_id is its user's id). The API key comes from
# WORKOS_API_KEY.
[security]
default = "deny"

[security.providers.workos]
kind = "workos"
organization = "chlive-chat"
poll = "2s"

[tables.messages.security]
table = { provider = "workos", grants = "messages:read" }
provider = "workos"
column = "user_id"
grants = "feed:read"

[tables.users.security]
public = true
