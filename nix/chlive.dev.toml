# The dev shell's server (`dnvr up`); addresses come from flags, since every process picks its
# ports on start. Keys and defaults: server/chlive.example.toml.

[clickhouse]
password = "chlive_ro"
snapshot_password = "chlive_snap"
# made by scripts/schema.sql
snapshot_database = "chlive_snapshots"

[cache]
# stored results (warm and cold); `reset-data` deletes them with the data they point into
dir = ".dnvr/chlive-cache"

[log]
# the shared results' lives in detail (joins, resumes, warm, cold, restores, the disk store)
level = "info,chlive_server::hub=debug,chlive_server::store=debug"

[tables.events]
[tables.events.columns]
# stored by the sink connector's InsertField transform (nix/shell.nix)
kafka_partition = { kafka = "partition" }
kafka_offset = { kafka = "offset" }
kafka_ts = { kafka = "timestamp" }

[tables.orders]
[tables.customers]
[tables.products]
