[package]
name = "chlive-server"
edition = "2021"
version = "0.1.0"
license = "MIT"

# A thin WebSocket layer over chlive-engine (src/lib.rs); the binary runs it (src/main.rs).
[lib]
path = "src/lib.rs"

[[bin]]
name = "chlive"
path = "src/main.rs"

[dependencies]
chlive-engine = { path = "../engine" }
chlive-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
anyhow = "1"
# the config (src/config.rs): defaults, a TOML file, env vars and flags, in layers
figment = { version = "0.10", features = ["toml", "env"] }
toml = "1"
humantime-serde = "1"
# the shared results' disk store (src/store.rs)
rusqlite = { version = "0.40", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# row-level security's Postgres provider (src/security/postgres.rs): its tables, then logical
# replication (pgoutput, decoded in src/security/pgoutput.rs)
tokio-postgres = "0.7"
pgwire-replication = { version = "0.4.1", default-features = false, features = ["scram"] }
bytes = "1"
# the WorkOS provider (src/security/workos.rs): its API, polled
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# credentials (src/auth.rs): JWTs, verified with the issuer's public keys only (rust_crypto:
# pure Rust, no aws-lc build)
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# binary only
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
chlive-client = { path = "../client-rs" }
# minting the auth tests' credentials (the server only ever verifies them)
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
figment = { version = "0.10", features = ["toml", "env", "test"] }
async-trait = "0.1"
tokio-tungstenite = "0.30"
