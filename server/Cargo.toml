[package]
name = "chlive-server"
edition = "2021"
version = "0.1.0"
license = "MIT"

# A thin WebSocket layer over chlive-engine (src/lib.rs); the binary runs it (src/main.rs).
[lib]
path = "src/lib.rs"

[[bin]]
name = "chlive"
path = "src/main.rs"

[dependencies]
chlive-engine = { path = "../engine" }
chlive-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
anyhow = "1"
# the config (src/config.rs): defaults, a TOML file, env vars and flags, in layers
figment = { version = "0.10", features = ["toml", "env"] }
toml = "1"
humantime-serde = "1"
# the shared results' disk store (src/store.rs)
rusqlite = { version = "0.40", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# binary only
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
figment = { version = "0.10", features = ["toml", "env", "test"] }
async-trait = "0.1"
tokio-tungstenite = "0.30"
