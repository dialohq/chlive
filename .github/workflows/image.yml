# The server's image (packages.chlive-image, built by nix2container): built on every pull request
# and push, and pushed to GHCR as `sha-<commit>`, plus `master` from master and the tag from v* tags.
name: image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # the server's own tests run as part of the build
      - name: Build
        run: nix build .#chlive-image -L
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # nix2container's skopeo reads the login from ~/.docker/config.json
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags=("sha-${GITHUB_SHA::12}")
          case $GITHUB_REF in
            refs/tags/*) tags+=("$GITHUB_REF_NAME") ;;
            refs/heads/master) tags+=(master) ;;
          esac
          for t in "${tags[@]}"; do
            nix run .#chlive-image.copyTo -- "docker://$IMAGE:$t"
          done
