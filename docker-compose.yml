# chlive dev stack. Both ClickHouse servers MUST run the same version:
# AggregateFunction state binary formats are only guaranteed compatible within a version.
x-clickhouse-image: &ch_image clickhouse/clickhouse-server:25.8

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      # HTTP proxy: lets the simple demo produce to Kafka straight from the browser
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v25.2.1
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events customers orders; do
          rpk -X brokers=redpanda:9092 topic create $$t -p 3 -r 1 || true
        done
    restart: "no"

  clickhouse-main:
    image: *ch_image
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - ./infra/main-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/main-users.xml:/etc/clickhouse-server/users.d/chlive.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password default -q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse-cache:
    image: *ch_image
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    ports:
      - "8124:8123"
    volumes:
      - ./infra/cache-config.xml:/etc/clickhouse-server/config.d/chlive.xml:ro
      - ./infra/cache-users.xml:/etc/clickhouse-server/users.d/zz-chlive.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password default -q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  console:
    image: redpandadata/console:v3.1.2
    profiles: ["console"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda: { condition: service_healthy }
