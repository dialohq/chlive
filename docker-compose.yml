# chlive dev stack. The main ClickHouse version MUST match the chDB engine embedded in
# chlive-server (flake.nix, libchdb 26.7.3 = ClickHouse 26.7.2): AggregateFunction states
# cross between them in binary form.
x-clickhouse-image: &ch_image clickhouse/clickhouse-server:26.7.2

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.1
    # The HTTP proxy batches produce requests for 100 ms by default; disable that so a
    # single write from the simple demo is acknowledged (and visible) immediately.
    entrypoint:
      - /bin/bash
      - -c
      - rpk redpanda config set pandaproxy_client.produce_batch_delay_ms 0 && exec /entrypoint.sh "$$@"
      - --
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      # HTTP proxy: lets the simple demo produce to Kafka straight from the browser
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v25.2.1
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events customers orders; do
          rpk -X brokers=redpanda:9092 topic create $$t -p 3 -r 1 || true
        done
    restart: "no"

  clickhouse-main:
    image: *ch_image
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      # native protocol, used by remote() from the chDB cache inside chlive-server
      - "19000:9000"
    volumes:
      - ./infra/main-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/main-users.xml:/etc/clickhouse-server/users.d/chlive.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password default -q 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  console:
    image: redpandadata/console:v3.1.2
    profiles: ["console"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda: { condition: service_healthy }
